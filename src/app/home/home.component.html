<header class="draggable">
  <button class="no-drag close-button" (click)="close()">X</button>
</header>

<main>
  <div *ngIf="apiKey">
    <div class="container">
      <button (click)="toggle()"> play pause </button>
      <button (click)="skip()"> skip </button>
    </div>
  </div>

  <div *ngIf="!apiKey">
    <h2>Veuillez renseigner votre clé API dans le menu "Account"</h2>
  </div>
</main>
