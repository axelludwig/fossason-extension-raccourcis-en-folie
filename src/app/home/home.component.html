<main class="draggable">
  <div *ngIf="apiKey">
    <div class="container">
      <button class="no-drag" (click)="openAccountParameters()">Account parameters</button> 
      <button class="no-drag" (click)="toggle()"> play pause </button>
      <button class="no-drag" (click)="skip()"> skip </button>
    </div>
  </div>

  <div *ngIf="!apiKey">
    <h2>Veuillez renseigner votre clé API dans le menu "Account"</h2>
  </div>
</main>
